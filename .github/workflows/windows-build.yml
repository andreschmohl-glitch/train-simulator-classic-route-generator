name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/TscRouteGenerator/TscRouteGenerator.csproj
      - name: Build
        run: dotnet build src/TscRouteGenerator/TscRouteGenerator.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/TscRouteGenerator/TscRouteGenerator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: TSC-Route-Generator-win-x64
          path: src/TscRouteGenerator/bin/Release/net8.0-windows/win-x64/publish/
